{% extends 'base.html' %}
{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #fff3e0, #ffe6e6);
    font-family: 'Poppins', sans-serif;
  }

  /* Main Card */
  .login-card {
    max-width: 420px;
    margin: 70px auto;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
    padding: 40px 45px;
    transition: all 0.4s ease;
  }

  .login-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
  }

  /* Heading */
  .login-card h4 {
    text-align: center;
    margin-bottom: 25px;
    color: #ff3f34;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  /* Form labels and inputs */
  .form-label {
    font-weight: 500;
    color: #444;
  }

  .form-control {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    transition: all 0.25s ease-in-out;
    height: 48px;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);
  }

  .form-control:focus {
    border-color: #ff3f34;
    box-shadow: 0 0 6px rgba(255, 63, 52, 0.3);
  }

  /* Forgot password link inside form */
  .forgot-link {
    display: block;
    text-align: right;
    font-size: 14px;
    margin-top: 6px;
  }

  .forgot-link a {
    text-decoration: none;
    color: #777;
    transition: color 0.3s;
  }

  .forgot-link a:hover {
    color: #ff3f34;
    text-decoration: underline;
  }

  /* Login Button */
  .btn-login {
    display: block;
    width: 100%;
    margin-top: 25px;
    background: linear-gradient(90deg, #ff3f34, #ff6b6b);
    color: #fff;
    border: none;
    padding: 12px 0;
    border-radius: 30px;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s ease-in-out;
    box-shadow: 0 3px 10px rgba(255, 63, 52, 0.3);
  }

  .btn-login:hover {
    background: linear-gradient(90deg, #e03128, #ff4d4d);
    box-shadow: 0 6px 15px rgba(255, 63, 52, 0.4);
  }

  /* Forgot + Register text below card */
  .bottom-text {
    text-align: center;
    margin-top: 25px;
    color: #555;
    font-size: 15px;
  }

  .bottom-text a {
    color: #ff3f34;
    font-weight: 600;
    text-decoration: none;
  }

  .bottom-text a:hover {
    text-decoration: underline;
  }

  /* Animation for form entry */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .login-card {
    animation: fadeInUp 0.6s ease;
  }
</style>

<div class="login-card">
  <h4>Login</h4>

  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-warning">{{ m }}</div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_username" class="form-label">Username</label>
      <input type="text" name="username" class="form-control" id="id_username" placeholder="Enter your username" required>
    </div>

    <div class="mb-3">
      <label for="id_password" class="form-label">Password</label>
      <input type="password" name="password" class="form-control" id="id_password" placeholder="Enter your password" required>
    </div>

    <div class="forgot-link">
      <a href="{% url 'kitchen:password_reset' %}">Forgot password?</a>
    </div>

    <button type="submit" class="btn-login">Login</button>
  </form>
</div>

<p class="bottom-text">
  Don’t have an account?
  <a href="{% url 'kitchen:register' %}">Register Now</a>
</p>
{% endblock %}
