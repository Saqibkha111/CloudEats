{% extends 'base.html' %}
{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #fff6f5, #fffaf5);
    font-family: 'Poppins', sans-serif;
  }

  /* 🌟 Contact Container */
  .contact-container {
    max-width: 700px;
    margin: 70px auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    padding: 50px 60px;
    text-align: center;
    animation: fadeIn 0.8s ease;
  }

  .contact-container h2 {
    color: #ff3f34;
    font-weight: 700;
    margin-bottom: 15px;
    font-size: 2rem;
  }

  .contact-container p {
    color: #555;
    font-size: 16px;
    margin-bottom: 35px;
  }

  /* 🌟 Contact Info Box */
  .contact-info {
    background: #fff8f8;
    border-radius: 14px;
    border: 1px solid #ffe0e0;
    padding: 25px 30px;
    box-shadow: 0 3px 12px rgba(255, 63, 52, 0.08);
    margin-bottom: 25px;
  }

  .contact-info p {
    margin: 8px 0;
    font-size: 16px;
    color: #333;
  }

  .contact-info i {
    color: #ff3f34;
    margin-right: 10px;
  }

  /* 🌟 Contact Form */
  form {
    text-align: left;
  }

  label {
    font-weight: 500;
    color: #444;
    margin-bottom: 6px;
  }

  input, textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    margin-bottom: 18px;
    outline: none;
    transition: 0.3s;
  }

  input:focus, textarea:focus {
    border-color: #ff3f34;
    box-shadow: 0 0 6px rgba(255, 63, 52, 0.3);
  }

  textarea {
    resize: none;
    height: 120px;
  }

  .btn-submit {
    display: inline-block;
    background: linear-gradient(90deg, #ff3f34, #ff6b6b);
    color: #fff;
    border: none;
    font-weight: 600;
    border-radius: 30px;
    padding: 12px 32px;
    transition: 0.3s;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255, 63, 52, 0.3);
  }

  .btn-submit:hover {
    background: linear-gradient(90deg, #e03128, #ff5050);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(255, 63, 52, 0.35);
  }

  /* 🌟 Fade-in Animation */
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(25px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* 🌟 Responsive */
  @media (max-width: 600px) {
    .contact-container {
      padding: 30px 25px;
      margin: 50px 20px;
    }

    .contact-container h2 {
      font-size: 1.7rem;
    }
  }
</style>

<div class="contact-container">
  <h2>Contact Us 📞</h2>
  <p>We’d love to hear from you! Whether it’s feedback, support, or partnership — we’re here for you.</p>

  <div class="contact-info">
    <p><i class="bi bi-envelope-fill"></i><strong>Email:</strong> support@cloudeats.com</p>
    <p><i class="bi bi-telephone-fill"></i><strong>Phone:</strong> +91 7011200137</p>
    <p><i class="bi bi-geo-alt-fill"></i><strong>Address:</strong> CloudEats HQ, Delhi-Shahdra</p>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>
    </div>

    <div class="mb-3">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
    </div>

    <div class="mb-3">
      <label for="message">Your Message</label>
      <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
    </div>

    <button type="submit" class="btn-submit">Send Message</button>
  </form>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
{% endblock %}
