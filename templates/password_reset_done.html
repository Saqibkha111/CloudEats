{% extends 'base.html' %}
{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #fff6f5, #fffaf5);
    font-family: 'Poppins', sans-serif;
  }

  /* 🌟 Main Card */
  .email-container {
    max-width: 480px;
    margin: 80px auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    padding: 45px 40px;
    text-align: center;
    animation: fadeIn 0.8s ease;
  }

  /* 🌟 Envelope Icon */
  .email-icon {
    width: 90px;
    height: 90px;
    background: linear-gradient(90deg, #ff3f34, #ff6b6b);
    color: #fff;
    font-size: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    animation: pop 0.6s ease-in-out;
    box-shadow: 0 4px 16px rgba(255, 63, 52, 0.3);
  }

  /* 🌟 Heading and Text */
  h3 {
    color: #ff3f34;
    font-weight: 700;
    margin-bottom: 10px;
    font-size: 1.8rem;
  }

  p {
    color: #555;
    font-size: 15px;
    margin-bottom: 25px;
    line-height: 1.6;
  }

  /* 🌟 Back Button */
  .btn-back {
    display: inline-block;
    background: linear-gradient(90deg, #ff3f34, #ff6b6b);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    border: none;
    padding: 11px 26px;
    border-radius: 30px;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(255, 63, 52, 0.25);
  }

  .btn-back:hover {
    background: linear-gradient(90deg, #e03128, #ff5050);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(255, 63, 52, 0.35);
  }

  /* 🌟 Animations */
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(25px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 🌟 Responsive */
  @media (max-width: 600px) {
    .email-container {
      margin: 60px 20px;
      padding: 35px 25px;
    }

    h3 {
      font-size: 1.6rem;
    }

    .email-icon {
      width: 75px;
      height: 75px;
      font-size: 32px;
    }
  }
</style>

<div class="email-container">
  <div class="email-icon">
    ✉️
  </div>
  <h3>Check Your Email</h3>
  <p>
    If an account exists with the email you provided, you'll receive instructions to reset your password shortly.
  </p>
  <a href="{% url 'kitchen:login' %}" class="btn-back">⬅️ Back to Login</a>
</div>
{% endblock %}
