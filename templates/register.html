{% extends 'base.html' %}
{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #fff6f5, #fffaf5);
    font-family: 'Poppins', sans-serif;
  }

  /* 🌟 Registration Card */
  .register-card {
    max-width: 460px;
    margin: 80px auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    padding: 45px 50px;
    transition: 0.3s ease-in-out;
    animation: fadeIn 0.8s ease;
  }

  .register-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(255, 63, 52, 0.15);
  }

  .register-card h3 {
    text-align: center;
    margin-bottom: 25px;
    color: #ff3f34;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  /* 🌟 Form Fields */
  form p {
    margin-bottom: 18px;
  }

  input, select, textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
    transition: 0.3s;
    background-color: #fff;
  }

  input:focus, select:focus, textarea:focus {
    border-color: #ff3f34;
    box-shadow: 0 0 6px rgba(255, 63, 52, 0.3);
  }

  label {
    font-weight: 500;
    color: #444;
    margin-bottom: 6px;
    display: block;
  }

  /* 🌟 Register Button */
  .btn-register {
    display: block;
    width: 100%;
    background: linear-gradient(90deg, #ff3f34, #ff6b6b);
    color: #fff;
    border: none;
    padding: 12px 0;
    border-radius: 30px;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s ease-in-out;
    margin-top: 10px;
    box-shadow: 0 5px 15px rgba(255, 63, 52, 0.3);
  }

  .btn-register:hover {
    background: linear-gradient(90deg, #e03128, #ff5050);
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(255, 63, 52, 0.35);
  }

  /* 🌟 Footer Note */
  .footer-note {
    text-align: center;
    font-size: 14px;
    color: #777;
    margin-top: 20px;
  }

  .footer-note a {
    color: #ff3f34;
    font-weight: 600;
    text-decoration: none;
  }

  .footer-note a:hover {
    text-decoration: underline;
  }

  /* 🌟 Animations */
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(25px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* 🌟 Responsive */
  @media (max-width: 600px) {
    .register-card {
      margin: 60px 20px;
      padding: 35px 25px;
    }

    .register-card h3 {
      font-size: 1.7rem;
    }
  }
</style>

<div class="register-card">
  <h3>Create Your Account 🍽️</h3>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn-register" type="submit">Register</button>
  </form>

  <div class="footer-note">
    Already have an account?
    <a href="{% url 'login' %}">Login here</a>
  </div>
</div>
{% endblock %}
