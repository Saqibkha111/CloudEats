{% extends 'base.html' %}
{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #fff6f5, #fffaf5);
    font-family: 'Poppins', sans-serif;
  }

  /* 🌟 Main Container */
  .success-container {
    max-width: 480px;
    margin: 80px auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    padding: 50px 40px;
    text-align: center;
    animation: fadeIn 0.8s ease;
  }

  /* 🌟 Success Icon */
  .success-icon {
    width: 100px;
    height: 100px;
    background: linear-gradient(90deg, #2ecc71, #27ae60);
    color: #fff;
    font-size: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    position: relative;
    animation: pop 0.5s ease-in-out;
  }

  /* Glowing ring */
  .success-icon::after {
    content: "";
    position: absolute;
    inset: -8px;
    border: 3px solid rgba(46, 204, 113, 0.4);
    border-radius: 50%;
    animation: ringPulse 1.6s ease-out infinite;
  }

  /* 🌟 Animations */
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes ringPulse {
    0% {
      transform: scale(0.9);
      opacity: 1;
    }
    100% {
      transform: scale(1.4);
      opacity: 0;
    }
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(25px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* 🌟 Text Styling */
  h3 {
    color: #2ecc71;
    font-weight: 700;
    margin-bottom: 12px;
    font-size: 1.8rem;
  }

  p {
    color: #555;
    font-size: 16px;
    margin-bottom: 25px;
    line-height: 1.6;
  }

  /* 🌟 Buttons */
  .btn-home, .btn-orders {
    display: inline-block;
    background: linear-gradient(90deg, #ff3f34, #ff6b6b);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    border: none;
    padding: 11px 26px;
    border-radius: 30px;
    margin: 8px;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(255, 63, 52, 0.3);
  }

  .btn-home:hover, .btn-orders:hover {
    background: linear-gradient(90deg, #e03128, #ff5050);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(255, 63, 52, 0.35);
  }

  /* 🌟 Responsive */
  @media (max-width: 600px) {
    .success-container {
      padding: 35px 25px;
      margin: 60px 20px;
    }

    h3 {
      font-size: 1.5rem;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      font-size: 40px;
    }
  }
</style>

<div class="success-container">
  <div class="success-icon">✓</div>
  <h3>Order Placed Successfully!</h3>
  <p>Thank you for your order 🙌<br>Your delicious meal is being prepared and will arrive soon!</p>

  <a href="{% url 'index' %}" class="btn-home">🏠 Go to Home</a>
  <a href="{% url 'kitchen:cart' %}" class="btn-orders">🧾 View Orders</a>
</div>
{% endblock %}
