{% extends 'base.html' %}
{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #fff6f5, #fffaf5);
    font-family: 'Poppins', sans-serif;
  }

  /* 🌟 Main Card */
  .reset-card {
    max-width: 480px;
    margin: 80px auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    padding: 45px 40px;
    animation: fadeIn 0.8s ease;
  }

  .reset-card h3 {
    text-align: center;
    color: #ff3f34;
    font-weight: 700;
    margin-bottom: 15px;
  }

  .reset-card p {
    text-align: center;
    color: #555;
    font-size: 15px;
    margin-bottom: 25px;
  }

  /* 🌟 Input Fields */
  input[type="email"] {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    outline: none;
    transition: all 0.3s ease;
  }

  input[type="email"]:focus {
    border-color: #ff3f34;
    box-shadow: 0 0 6px rgba(255, 63, 52, 0.3);
  }

  label {
    font-weight: 500;
    color: #444;
    margin-bottom: 8px;
    display: block;
  }

  /* 🌟 Submit Button */
  .btn-reset {
    display: block;
    width: 100%;
    background: linear-gradient(90deg, #ff3f34, #ff6b6b);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    border: none;
    padding: 12px 0;
    border-radius: 30px;
    margin-top: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(255, 63, 52, 0.3);
  }

  .btn-reset:hover {
    background: linear-gradient(90deg, #e03128, #ff5050);
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(255, 63, 52, 0.35);
  }

  /* 🌟 Fade-in Animation */
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(25px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* 🌟 Responsive */
  @media (max-width: 600px) {
    .reset-card {
      margin: 60px 20px;
      padding: 35px 25px;
    }

    .reset-card h3 {
      font-size: 1.6rem;
    }
  }
</style>

<div class="reset-card">
  <h3>🔑 Reset Your Password</h3>
  <p>Enter your account email and we'll send you instructions to reset your password.</p>

  <form method="post">
    {% csrf_token %}
    <label for="id_email">{{ form.email.label }}</label>
    {{ form.email }}
    <button class="btn-reset" type="submit">Send Reset Email</button>
  </form>
</div>
{% endblock %}
